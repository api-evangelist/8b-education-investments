authorship_note: >-
  This server is PLATFORM-AUTHORED, not provider-authored. It is registered by the
  WordPress MCP Adapter plugin family running on 8B's WP Engine hosted WordPress install
  (the same install serves Divi, Yoast, Wordfence, Uncanny Automator and Amelia routes
  under /wp-json/). 8B publishes no documentation for it and markets no developer program.
  What is genuinely 8B's is the operation: the endpoint, the OAuth issuer, the token and
  revocation endpoints and the tenant data behind them are all on 8B's own host under 8B's
  own domain. Recorded here as a real, reachable agent surface with its authorship stated,
  so that no downstream reader mistakes a plugin default for a product 8B designed.
