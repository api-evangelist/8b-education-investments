summary: >-
  The only authenticated API surface 8B exposes is its Model Context Protocol endpoint,
  and it is protected by OAuth 2.1-style authorization code with PKCE. Discovery is
  standards-correct end to end: the protected resource advertises its authorization
  server, the authorization server advertises its endpoints and scope, and an
  unauthenticated call returns 401 with a WWW-Authenticate Bearer challenge that points
  back at the resource metadata. No API keys, no basic auth, no mTLS and no OpenID
  Connect are offered.
schemes:
- name: mcp_oauth
  type: oauth2
  applies_to: https://www.8b.africa/wp-json/mcp/mcp-oauth-server
  flows:
    authorization_code:
      authorization_url: https://www.8b.africa/oauth/authorize
      token_url: https://www.8b.africa/oauth/token
      revocation_url: https://www.8b.africa/oauth/revoke
      refresh_supported: true
      pkce_required: true
      pkce_methods:
      - S256
      scopes:
        mcp: Access to the Model Context Protocol endpoint.
  client_authentication:
    token_endpoint_auth_methods_supported:
    - none
    note: >-
      Public clients only — the token endpoint accepts no client secret, which is the
      expected posture for MCP clients running on a user's machine and is why PKCE is
      mandatory rather than optional.
  client_registration:
    dynamic_client_registration_endpoint: null
    client_id_metadata_document_supported: true
    note: >-
      No RFC 7591 registration endpoint is advertised. Instead the server declares
      client_id_metadata_document_supported, so a client identifies itself by publishing a
      client-ID metadata document at an HTTPS URL and using that URL as its client_id.
  bearer:
    methods_supported:
    - header
    note: Bearer token in the Authorization header. No query-parameter or body form offered.
