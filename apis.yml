apis:
- aid: 8b-education-investments-mcp
  name: 8B Model Context Protocol Server
  description: 'An OAuth-protected Model Context Protocol endpoint served from 8B''s own
    WordPress installation at www.8b.africa. Discovery is standards-conformant: an RFC 8414
    authorization-server metadata document and an RFC 9728 protected-resource metadata document
    are both served anonymously, and an unauthenticated JSON-RPC tools/list returns HTTP 401 with
    a WWW-Authenticate Bearer challenge naming the resource metadata. The tool list itself is
    therefore auth-gated and was not enumerated. Authorship is platform, not provider: the server
    is registered by the WordPress MCP Adapter plugin family (three servers are exposed —
    mcp-oauth-server, mcp-adapter-default-server and amelia-mcp-server) rather than authored by
    8B, but it is operated on 8B''s own host under 8B''s own OAuth issuer.'
  humanURL: https://www.8b.africa/
  baseURL: https://www.8b.africa/wp-json/mcp/mcp-oauth-server
  image: https://www.8b.africa/wp-content/uploads/2022/06/cropped-8b-Icon-192x192.png
