aid: 8b-education-investments
name: 8B Education Investments
description: '8B Education Investments (legally 8B Finance, Inc., trading as 8B) is a New York
  headquartered education-finance company founded in 2017 by Lydiah Kemunto Bosire that helps
  African students pay for degrees at universities outside Africa. It operates a student-loan
  marketplace and eligibility comparison tool, an income-share and guarantee backed lending
  program originated with partner banks including Nelnet Bank, a University Reserve admissions
  product, and a free community platform of prospective and current students offering
  scholarships, courses, forums, events and job listings. 8B publishes no public developer
  program or API reference; the only machine-readable surfaces it serves are an llms.txt on its
  marketing site and an OAuth-protected Model Context Protocol endpoint exposed by its WordPress
  stack.'
